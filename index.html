<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>人造语言学习助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#f6f6f4;--bg2:#ebebe9;--card:#fff;--card2:#f1f1ef;--tabbg:rgba(255,255,255,.92);--line:rgba(0,0,0,.09);
  --text:#1c1c1e;--text2:#6e6e73;--text3:#a8a8ad;
  --btnbg:#1c1c1e;--btnfg:#fff;--prisoft:#ececea;--ring:rgba(0,0,0,.1);
  --accent:#8a6b4f;
  --danger:#b3261e;--dangersoft:#f6e7e5;
  --sh1:0 1px 8px rgba(0,0,0,.05);--sh2:0 10px 30px rgba(0,0,0,.14);
  --r:16px;--rs:20px;--tabh:58px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.page{display:none}.page.active{display:block;animation:fadeUp .3s ease}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 15px}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:.5px;white-space:nowrap;line-height:1.2}
.head-l{display:flex;align-items:center;gap:8px}
.back2{font-size:18px;color:var(--text2);padding:2px 8px}
.count-chip{background:var(--prisoft);color:var(--accent);border-radius:999px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;height:24px;padding:0 11px;flex:none;transform:translateY(2px)}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin:10px 0;box-shadow:var(--sh1);border:1px solid var(--line)}
.card.gest,.card.pick{cursor:pointer;transition:transform .15s}
.card.gest:active,.card.pick:active{transform:scale(.98)}
.note-box{color:var(--text2);font-size:13.5px;line-height:1.7}
.sug{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.sug-k{font-weight:700;font-size:15px;color:var(--text)}
.sug-v{color:var(--text3);font-size:14px}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:13px 18px;box-shadow:var(--sh1);border:1px solid var(--line);margin-bottom:5px}
.search-wrap input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px}
.btn{display:block;width:100%;border-radius:999px;padding:11px 15px;font-size:14px;font-weight:600;margin-top:8px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--btnbg);color:var(--btnfg)}
.btn.soft{background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:var(--sh1)}
.btn.lib{background:var(--card);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.big{padding:14px;font-size:15px;margin-top:14px}
.btn-row.two{display:flex;gap:8px}.btn-row.two .btn{flex:1;margin-top:10px}
.seg{display:flex;gap:6px;background:var(--card2);border-radius:999px;padding:3px;margin-bottom:6px}
.seg-item{flex:1;text-align:center;padding:10px 0;border-radius:999px;color:var(--text2);font-size:13.5px;transition:.2s}
.seg-item:not(.on){border:1px solid var(--line)}
.seg-item.on{background:var(--btnbg);color:var(--btnfg);font-weight:700}
.qnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;
  background:linear-gradient(var(--bg1) 78%,transparent);scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qn{flex:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--text2);transition:.15s}
.qn:active{transform:scale(.93);color:var(--text)}
.w-name{font-size:18px;font-weight:800;color:var(--text)}
.w-pho{margin-top:6px;color:var(--text3);font-size:14px}
.w-sub{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.w-mean-i{color:var(--text2);font-size:14px}
.w-tag{background:var(--prisoft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700}
.w-extra{margin-top:6px;color:var(--text3);font-size:13px;white-space:pre-wrap}
.ex-head{font-size:13px;font-weight:800;color:var(--text2);margin:14px 2px 2px}
.ex-list{padding:4px 14px}
.ex-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.ex-item:last-child{border-bottom:none}
.ex-n{flex:none;color:var(--text3);font-weight:700}
.ex-src{font-size:14.5px;font-weight:600;color:var(--text)}
.ex-tr{margin-top:4px;font-size:13.5px;color:var(--text3)}
.d-group{display:flex;align-items:center;margin:18px 2px 8px;padding:4px 2px;cursor:pointer}
.d-pill{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh1)}
.d-key{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:1px;line-height:1}
.d-group .cnt{color:var(--text2);font-size:14px;font-weight:700;line-height:1}
.d-group .fold{margin-left:auto;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.d-group .fold svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:3;stroke-linejoin:round;transition:transform .2s}
.d-group .fold.open svg{transform:rotate(90deg)}
.pos-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pos-item{border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;background:var(--card2);color:var(--text2);transition:.15s}
.pos-item:active{transform:scale(.95)}
.pos-item.on{background:var(--btnbg);color:var(--btnfg)}
.f-label{display:block;font-size:13px;color:var(--text2);margin:12px 0 5px}
.f-label i{color:var(--danger);font-style:normal}
.sheet input{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:999px;padding:11px 16px;font-size:14px;outline:none;transition:.2s}
.sheet textarea{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:var(--rs);padding:11px 16px;font-size:14px;outline:none;transition:.2s;min-height:70px;resize:vertical}
.sheet input:focus,.sheet textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.sense-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.sense-row input{width:auto;flex:1;min-width:0}
.pos-btn{flex:none;min-width:84px;background:var(--prisoft);color:var(--accent);border-radius:999px;padding:10px 12px;font-size:12.5px;font-weight:700}
.sense-del{flex:none;width:34px;height:34px;border-radius:50%;background:var(--dangersoft);color:var(--danger);font-size:16px}
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;z-index:20;
  background:var(--tabbg);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transition:transform .25s ease}
#tabbar.kb-hide{transform:translateY(110%)}
#tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabh);color:var(--text3);font-size:11px;font-weight:600}
#tabbar .ico{font-size:17px;filter:grayscale(1);opacity:.8}
#tabbar .tab.on{color:var(--text)}
#tabbar .tab.on .ico{opacity:1}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translate(-50%,-220%);opacity:0;
  background:rgba(38,38,42,.78);color:#fff;padding:10px 26px;border-radius:999px;font-size:13px;text-align:center;
  min-width:50%;max-width:94%;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s;z-index:99;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.danger{background:rgba(179,38,30,.85)}
.sheet{position:fixed;inset:0;z-index:50}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:slideUp .3s cubic-bezier(.2,.9,.3,1)}
.sheet.center{display:flex;align-items:flex-start;justify-content:center;padding:18vh 16px 0}
.dialog{position:relative;background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:320px;box-shadow:var(--sh2);animation:scaleIn .2s ease}
.d-title{font-size:16px;font-weight:700;margin-bottom:6px;text-align:center}
.d-content{font-size:13.5px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.d-btns{display:flex;gap:8px;margin-top:16px}
.d-btns .btn{margin-top:0;flex:1;padding:10px}
.btn.danger{background:var(--danger);color:#fff}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sh-title{font-size:16px;font-weight:700}
.sh-close{color:var(--text3);padding:4px 8px}
</style>
</head>
<body>

<nav id="tabbar">
  <button class="tab on" data-action="tab" data-page="words"><span class="ico">📝</span>词汇</button>
  <button class="tab" data-action="tab" data-page="dict"><span class="ico">📚</span>词库</button>
  <button class="tab" data-action="tab" data-page="sentences"><span class="ico">🗒️</span>语句</button>
</nav>

<div id="app">

  <section class="page" data-page="words">
    <div class="page-head">
      <div class="head-l"><h1>词汇</h1><span class="count-chip" id="wordCount">0</span></div>
    </div>
    <div class="search-wrap"><input id="searchInput" aria-label="搜索" enterkeyhint="search"></div>
    <div id="sugList"></div>
    <div id="wordsActions">
      <div class="btn-row two">
        <button class="btn soft" data-action="word-add">＋ 新增词汇</button>
        <button class="btn soft" data-action="csv-open">批量导入</button>
      </div>
      <button class="btn primary big" data-action="doc-import">导入文档</button>
    </div>
  </section>

  <section class="page" data-page="search">
    <div class="page-head">
      <div class="head-l"><button class="back2" data-action="search-back">←</button><h1>搜索结果</h1></div>
    </div>
    <div id="searchBox"></div>
  </section>

  <section class="page" data-page="dict">
    <div class="page-head">
      <div class="head-l"><h1>词库</h1></div>
    </div>
    <div class="seg" id="dictSeg">
      <div class="seg-item on" data-action="dict-mode" data-mode="alpha">按首字母</div>
      <div class="seg-item" data-action="dict-mode" data-mode="pos">按词性</div>
    </div>
    <div class="qnav" id="qnav"></div>
    <div id="dictList"></div>
  </section>

  <section class="page" data-page="sentences">
    <div class="page-head">
      <div class="head-l"><h1>语句</h1><span class="count-chip" id="sentCount">0</span></div>
    </div>
    <div class="search-wrap"><input id="sentSearch" aria-label="搜索句子" enterkeyhint="search"></div>
    <div id="ssugList"></div>
    <div id="sentActions">
      <div class="btn-row two">
        <button class="btn soft" data-action="s-add">＋ 新增语句</button>
        <button class="btn soft" data-action="csv-open">批量导入</button>
      </div>
      <button class="btn primary big" data-action="doc-import">导入文档</button>
      <button class="btn lib big" data-action="sentlib-open">句库</button>
    </div>
  </section>

  <section class="page" data-page="ssearch">
    <div class="page-head">
      <div class="head-l"><button class="back2" data-action="ssearch-back">←</button><h1>搜索结果</h1></div>
    </div>
    <div id="ssearchBox"></div>
  </section>

  <section class="page" data-page="sentlib">
    <div class="page-head">
      <div class="head-l"><button class="back2" data-action="sentlib-back">←</button><h1>句库</h1></div>
    </div>
    <div id="sentlibList"></div>
  </section>

</div>

<script>
'use strict';
window.addEventListener('error',function(e){console.error(e);Toast('运行异常：'+(e.message||'未知错误'));});

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.from((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function newWord(obj){var o={id:uid(),created:Date.now(),raw:'',phonetic:'',note:'',senses:[]};for(var k in obj){o[k]=obj[k];}return o;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function hasWord(text,raw){
  var t=(text||'').toLowerCase(),r=(raw||'').toLowerCase();
  if(!r){return false;}
  if(r.indexOf(' ')>=0){return t.indexOf(r)>=0;}
  var m=t.match(/[a-z']+/g)||[];
  return m.indexOf(r)>=0;
}
var TRAD='個們語詞說話書學習東車馬鳥魚門問時間國萬與業華開關點聽讀寫買賣飛電雲風長張陳劉黃蘇盧葉鄭鄧蕭網線機場廠廳廚衛藝術體運動農豐財經濟貿銀錢價優勞勢議員會組織職權劃區縣鄉鎮歲歷轉輪灣臺號碼聯繫統軟應資訊絡數據庫備還進導瀏覽頁麵飯館飲藥醫護軍戰爭勝負敗敵親愛謝對錯誤舊壞醜惡熱溫涼億沒無這麼為誰幾兩內後麗離陽陰園圓圖環現選擇讓給雖盡總將並別極滿夠記憶識覺觀尋覓發創造製採用';
var SIMP='个们语词说话书学习东车马鸟鱼门问时间国万与业华开关点听读写买卖飞电云风长张陈刘黄苏卢叶郑邓萧网线机场厂厅厨卫艺术体运动农丰财经济贸银钱价优劳势议员会组织职权划区县乡镇岁历转轮湾台号码联系统软应资讯络数据库备还进导浏览页面饭馆饮药医护军战争胜负败敌亲爱谢对错误旧坏丑恶热温凉亿没无这么为谁几两内后丽离阳阴园圆图环现选择让给虽尽总将并别极满够记忆识觉观寻觅发创造制采用';
function t2s(s){return String(s).replace(/[\u4e00-\u9fff]/g,function(ch){var i=TRAD.indexOf(ch);return i>=0?SIMP.charAt(i):ch;});}
var POS_LIST=['名词','动词','修饰词','数词','冠词','代词','介词','连词','声词'];
var POS_RE=new RegExp('^('+POS_LIST.join('|')+')');
function existsWord(raw,exceptId){return Store.state.words.some(function(w){return w.raw.toLowerCase()===raw.toLowerCase()&&w.id!==exceptId;});}
var FOLD_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3 L15 10 L6 17 Z"></path></svg>';

var C_IPA={p:'p',b:'b',t:'t',d:'d',c:'k',g:'g',ch:'tʃ',j:'dʒ',f:'f',v:'v',s:'s',z:'z',sh:'ʃ',h:'h',m:'m',n:'n',r:'r',l:'l',y:'j',w:'w'};
var V_IPA={a:'a',e:'e',i:'i',o:'o',u:'u',ai:'ai',ei:'ei',oi:'oi',au:'au',eu:'eu'};
var CLUSTERS=['pl','pr','bl','br','tr','dr','cl','cr','gl','gr','fl','fr','sp','st','sc'];
function tokenizeIPA(s){
  s=String(s).toLowerCase();
  var units=[],i=0;
  while(i<s.length){
    var ch=s[i];
    if(!/[a-z]/.test(ch)){i++;continue;}
    var d=null,ks=['ai','ei','oi','au','eu'],ki;
    for(ki=0;ki<ks.length;ki++){if(s.indexOf(ks[ki],i)===i){d=ks[ki];break;}}
    if(d){units.push({v:1,g:d,ipa:V_IPA[d]});i+=d.length;continue;}
    if('aeiou'.indexOf(ch)>=0){units.push({v:1,g:ch,ipa:V_IPA[ch]});i++;continue;}
    var c=ch;
    if(s.indexOf('ch',i)===i){c='ch';}else if(s.indexOf('sh',i)===i){c='sh';}
    if(C_IPA[c]){units.push({v:0,g:c,ipa:C_IPA[c]});}
    i+=c.length;
  }
  return units;
}
function syllabify(units){
  var vIdx=units.map(function(u,i){return u.v?i:-1;}).filter(function(i){return i>=0;});
  if(!vIdx.length){return [units];}
  var sylls=[],cur=[],i,vi,j;
  for(i=0;i<=vIdx[0];i++){cur.push(units[i]);}
  for(vi=1;vi<vIdx.length;vi++){
    var nextV=vIdx[vi];
    var cs=units.slice(vIdx[vi-1]+1,nextV);
    var coda=[],onset=cs;
    if(cs.length){
      var g=cs.map(function(u){return u.g;}).join('');
      if(!(cs.length===1||CLUSTERS.indexOf(g)>=0)){coda=[cs[0]];onset=cs.slice(1);}
    }
    cur=cur.concat(coda);
    sylls.push(cur);
    cur=onset.concat([units[nextV]]);
  }
  for(j=vIdx[vIdx.length-1]+1;j<units.length;j++){cur.push(units[j]);}
  sylls.push(cur);
  return sylls;
}
function genIPA(raw){
  var ws=String(raw).toLowerCase().split(/\s+/).filter(function(w){return /[a-z]/.test(w);});
  var parts=[];
  for(var i=0;i<ws.length;i++){
    var units=tokenizeIPA(ws[i]);
    if(!units.length){continue;}
    var sylls=syllabify(units);
    var stress=Math.max(0,sylls.length-2);
    parts.push(sylls.map(function(sy,idx){return (idx===stress?"'":'')+sy.map(function(u){return u.ipa;}).join('');}).join('.'));
  }
  return parts.length?('/'+parts.join(' ')+'/'):'';
}

var NAME_KEY='CONLANG::';
var Persist={
  ok:false,
  check:function(){try{localStorage.setItem('__probe','1');this.ok=localStorage.getItem('__probe')==='1';localStorage.removeItem('__probe');}catch(e){this.ok=false;}return this.ok;}
};
function idbOpen(){return new Promise(function(res,rej){var q=indexedDB.open('conlang-db',1);
  q.onupgradeneeded=function(){q.result.createObjectStore('kv');};
  q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function idbSet(v){idbOpen().then(function(db){db.transaction('kv','readwrite').objectStore('kv').put(v,'data');}).catch(function(){});}
function idbGet(){return idbOpen().then(function(db){return new Promise(function(res){var g=db.transaction('kv').objectStore('kv').get('data');
  g.onsuccess=function(){res(g.result||null);};g.onerror=function(){res(null);};});}).catch(function(){return null;});}
function nameGet(){try{var n=window.name||'';if(n.indexOf(NAME_KEY)===0){return JSON.parse(n.slice(NAME_KEY.length));}}catch(e){}return null;}
function nameSet(j){try{if(j.length<1e6){window.name=NAME_KEY+j;}}catch(e){}}
var Store={
  KEY:'conlang.studio.v30', state:null,
  defaults:function(){return {version:30,langName:'我的人造语言',words:[],sentences:[]};},

function cleanDocxXml(xml){
  return xml.replace(/<w:tab[^>]*>/g,'\t').replace(/<w:br[^>]*>/g,'\n').replace(/<\/w:p>/g,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\u00a0/g,' ');
}
function readDocxIn(buf){
  var dv=new DataView(buf),eocd=-1,i;
  for(i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0){return Promise.reject(0);}
  var count=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true);
  var ent={};
  for(i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50){break;}
    var method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),
      clen=dv.getUint16(off+32,true),lhdr=dv.getUint32(off+42,true);
    ent[new TextDecoder().decode(new Uint8Array(buf,off+46,nlen))]={method:method,csize:csize,lhdr:lhdr};
    off+=46+nlen+elen+clen;
  }
  var e=ent['word/document.xml'];if(!e){return Promise.reject(0);}
  var lnlen=dv.getUint16(e.lhdr+26,true),lelen=dv.getUint16(e.lhdr+28,true);
  var data=new Uint8Array(buf,e.lhdr+30+lnlen+lelen,e.csize);
  if(e.method===0){return Promise.resolve(cleanDocxXml(new TextDecoder().decode(data)));}
  if(e.method===8&&'DecompressionStream' in window){
    var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(st).arrayBuffer().then(function(ab){return cleanDocxXml(new TextDecoder().decode(ab));});
  }
  return Promise.reject(0);
}
function readDoc(buf){
  var dv=new DataView(buf),out='',cur='';
  function fl(){var t=cur.trim();if(t.length>=4){out+=t+'\n';}cur='';}
  for(var i=0;i+1<buf.byteLength;i+=2){
    var ch=dv.getUint16(i,true);
    if((ch>=0x4e00&&ch<=0x9fff)||(ch>=0x3000&&ch<=0x303f)||ch===0xff08||ch===0xff09||(ch>=0x20&&ch<0x7f)||ch===13||ch===10||ch===9){cur+=String.fromCharCode(ch);}
    else{fl();}
  }
  fl();return out;
}
function isHead(l){
  if(!l||l.length>=40){return false;}
  var m=l.match(/^(#{1,6}\s+|第[一二三四五六七八九十百0-9]+[章节讲]|[一二三四五六七八九十]+[、.]|\d+[、.．]\s*|【)/);
  if(!m){return false;}
  return !/[a-zA-Z]/.test(l.slice(m[0].length));
}
function isGarbage(l){return /[<>{}]|xmlns|https?:\/\//.test(l);}
function classifyLine(t){
  t=t2s(String(t).replace(/^\ufeff/,'')).trim();
  if(!t||isGarbage(t)){return null;}
  if(/[@*#]/.test(t)){return null;}
  var pos='';
  var bm=t.match(/[（(]([^()（）]{1,12})[)）]/)||t.match(/\[([^\[\]]{1,12})\]/);
  if(bm&&POS_RE.test(bm[1])){pos=POS_RE.exec(bm[1])[0];}
  var clean=t.replace(/\/[^/]*\//g,' ').replace(/\[[^\]]*\]/g,' ').replace(/[（(][^)）]*[)）]/g,' ');
  var latinRuns=clean.match(/[A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*)*/g);
  if(!latinRuns){return null;}
  var ci=clean.search(/[\u4e00-\u9fff]/);
  var stext=(ci>=0)?clean.slice(0,ci):clean;
  stext=stext.replace(/[\s\-—–]+$/,'').trim();
  var isSent=/[.!?]/.test(stext);
  var cjkRuns=clean.match(/[\u4e00-\u9fff][\u4e00-\u9fff，,。；;：:、！!？?—\-]*/g)||[];
  var cands=[];
  for(var i=0;i<cjkRuns.length;i++){
    var r=cjkRuns[i].replace(/[\s，,、；;：:—\-]+$/,'');
    if(!isSent){r=r.replace(/[。!！?？]+$/,'');}
    if(!r){continue;}
    var skip=false;
    for(var pi=0;pi<POS_LIST.length;pi++){
      var p=POS_LIST[pi];
      if(r===p){pos=pos||p;skip=true;break;}
      if(r.indexOf(p)===0&&r.length>p.length&&/[，,。；;：:、]/.test(r.charAt(p.length))){pos=pos||p;r=r.slice(p.length+1);break;}
    }
    if(skip){continue;}
    if(r){cands.push(r);}
  }
  var cjk=cands.join('');
  if(isSent){
    if(!stext){return null;}
    return {kind:'s',text:stext,meaning:cjk};
  }
  var latin=latinRuns.slice().sort(function(a,b){return b.length-a.length;})[0].replace(/[\s.,;:!?]+$/,'').trim();
  if(!latin||!cjk){return null;}
  return {kind:'w',raw:latin,pos:pos,meaning:cjk};
}
function smartParse(text){
  var words=[],sents=[],seenW={},seenS={};
  String(text).replace(/^\ufeff/,'').split(/\r?\n/).forEach(function(line0){
    var line=line0.trim();
    if(!line||isHead(line)||isGarbage(line)){return;}
    if(/[@*#]/.test(line)){return;}
    line=line.replace(/^\d+[、.．]\s*/,'');
    var e=classifyLine(line);
    if(!e){return;}
    if(e.kind==='w'){var k=e.raw.toLowerCase();if(!seenW[k]){seenW[k]=1;words.push(e);}}
    else{var ks=e.text.toLowerCase();if(!seenS[ks]){seenS[ks]=1;sents.push(e);}}
  });
  return {words:words,sents:sents};
}
function sameSense(a,b){return (a.pos||'')===(b.pos||'')&&a.meaning===b.meaning;}
function handleImportText(txt){
  var r=smartParse(txt);
  if(!r.words.length&&!r.sents.length){Toast('未识别到内容','danger');return;}
  var st=Store.state;
  var batch={},order=[];
  r.words.forEach(function(e){
    var k=e.raw.toLowerCase();
    if(!batch[k]){batch[k]={raw:e.raw,senses:[]};order.push(k);}
    if(!batch[k].senses.some(function(s){return sameSense(s,e);})){batch[k].senses.push({pos:e.pos||'',meaning:e.meaning});}
  });
  var added=0,merged=0,dup=0;
  order.forEach(function(k){
    var b=batch[k];
    var ex=st.words.find(function(w){return w.raw.toLowerCase()===k;});
    if(ex){
      var changed=false;
      b.senses.forEach(function(s){
        if(!ex.senses.some(function(s2){return sameSense(s2,s);})){ex.senses.push(s);changed=true;}
      });
      if(changed){merged++;}else{dup++;}
    }else{
      b.phonetic=genIPA(b.raw);
      st.words.unshift(newWord(b));
      added++;
    }
  });
  var newS=[],dupS=0;
  r.sents.forEach(function(s){
    var has=st.sentences.some(function(x){return (x.text||'').toLowerCase()===s.text.toLowerCase();})||
      newS.some(function(x){return x.text.toLowerCase()===s.text.toLowerCase();});
    if(has){dupS++;}else{newS.push(s);}
  });
  if(!added&&!merged&&!newS.length){Toast('全部重复，未导入','danger');return;}
  Modal.confirm({title:'识别结果',ok:'导入',content:'新词 '+added+' 个 / 新义项 '+merged+' 条\n新句 '+newS.length+' 条 / 跳过 '+(dup+dupS)+' 条\n\n是否导入？'})
  .then(function(ok){
    if(!ok){return;}
    newS.forEach(function(s){st.sentences.unshift({id:uid(),type:'sentence',text:s.text,meaning:s.meaning||'',src:'',use:''});});
    Store.save();refreshAll();
    Toast('已导入：词 '+added+' / 句 '+newS.length);
  });
}
function applyImport(txt){
  if(!txt||!String(txt).trim()){Toast('内容为空');return;}
  var d=null;
  try{d=JSON.parse(txt);}catch(e){}
  if(d&&Array.isArray(d.words)){
    var st=Store.state;
    d.words.forEach(function(w){
      if(!Array.isArray(w.senses)||!w.senses.length){w.senses=[{pos:w.pos||'',meaning:w.meaning||''}];}
      if(!w.phonetic){w.phonetic=genIPA(w.raw);}
      var ex=st.words.find(function(x){return x.raw.toLowerCase()===String(w.raw).toLowerCase();});
      if(ex){
        w.senses.forEach(function(s){if(!ex.senses.some(function(s2){return sameSense(s2,s);})){ex.senses.push(s);}});
      }else{
        st.words.unshift(newWord(w));
      }
    });
    if(Array.isArray(d.sentences)){d.sentences.forEach(function(s){
      st.sentences.unshift({id:uid(),type:'sentence',text:s.text||'',meaning:s.meaning||'',src:s.src||'',use:s.use||''});
    });}
    Store.save();refreshAll();
    Toast('备份恢复成功');
  }else{handleImportText(txt);}
}

function wordSugs(q){
  q=(q||'').trim().toLowerCase();
  if(!q){return '';}
  var lat=/^[a-z]/.test(q);
  var list;
  if(lat){
    list=Store.state.words.filter(function(w){
      if(!/[A-Za-z]/.test(w.raw)){return false;}
      var ws2=w.raw.toLowerCase().split(/\s+/);
      return ws2.some(function(wd){return wd.indexOf(q)===0;});
    }).sort(function(a,b){
      var ea=(a.raw.toLowerCase()===q)?0:1,eb=(b.raw.toLowerCase()===q)?0:1;
      if(ea!==eb){return ea-eb;}
      if(a.raw.length!==b.raw.length){return a.raw.length-b.raw.length;}
      return a.raw.localeCompare(b.raw);
    });
  }else{
    list=Store.state.words.filter(function(w){
      if(!/[A-Za-z]/.test(w.raw)){return false;}
      return (w.senses||[]).some(function(s){return (s.meaning||'').toLowerCase().indexOf(q)>=0;});
    });
  }
  return list.slice(0,20).map(function(w){
    var mean=(w.senses||[]).map(function(s){return s.meaning;}).join(' / ');
    var inner=lat
      ?('<span class="sug-k">'+esc(w.raw)+'</span><span class="sug-v">'+esc(mean)+'</span>')
      :('<span class="sug-k">'+esc(mean)+'</span><span class="sug-v">'+esc(w.raw)+'</span>');
    return '<div class="card pick" data-type="word" data-id="'+w.id+'"><div class="sug">'+inner+'</div></div>';
  }).join('');
}
function sentSugs(q){
  q=(q||'').trim().toLowerCase();
  if(!q){return '';}
  var list=Store.state.sentences.filter(function(s){
    return s.type==='sentence'&&((s.text||'').toLowerCase().indexOf(q)>=0||(s.meaning||'').toLowerCase().indexOf(q)>=0);
  }).slice(0,20);
  return list.map(function(s){
    return '<div class="card pick" data-type="sent" data-id="'+s.id+'"><div class="sug"><span class="sug-k">'+esc(s.text)+'</span><span class="sug-v">'+esc(s.meaning||'')+'</span></div></div>';
  }).join('');
}

    this.phoTouched=!!(w&&w.phonetic);
    Modal.sheet('<div class="sheet-head"><span class="sh-title">'+(w?'编辑词汇':'新增词汇')+'</span><span class="sh-close" data-action="sheet-close">✕</span></div>'+
    '<label class="f-label">原词 <i>*</i></label><input id="wRaw" value="'+esc(w?w.raw:'')+'">'+
    '<label class="f-label">音标（自动生成，可修改）</label><input id="wPho" value="'+esc(w?w.phonetic:'')+'">'+
    '<label class="f-label">词性＋释义（可多组）</label><div id="senseList"></div>'+
    '<label class="f-label">补充说明</label><textarea id="wNote">'+esc(w?w.note:'')+'</textarea>'+
    '<button class="btn primary big" data-action="word-save">保存</button>');
    this.renderSenses();
  },
  renderSenses:function(){
    var self=this;
    var html=this.senses.map(function(s,i){
      return '<div class="sense-row">'+
        '<button class="pos-btn" data-action="sense-pos" data-i="'+i+'" data-pos="'+esc(s.pos)+'">'+(s.pos?esc(s.pos):'词性')+'</button>'+
        '<input value="'+esc(s.meaning)+'" placeholder="释义">'+
        '<button class="sense-del" data-action="sense-del" data-i="'+i+'">×</button></div>'+
        (self.openPos===i?('<div class="pos-grid" style="margin-top:8px">'+
          '<button class="pos-item'+(s.pos===''?' on':'')+'" data-action="sense-pick" data-i="'+i+'" data-pos="">无</button>'+
          POS_LIST.map(function(p){return '<button class="pos-item'+(p===s.pos?' on':'')+'" data-action="sense-pick" data-i="'+i+'" data-pos="'+p+'">'+p+'</button>';}).join('')+
        '</div>'):'');
    }).join('');
    $('#senseList').innerHTML=html+'<button class="btn soft" data-action="sense-add" style="margin-top:10px">＋ 添加一组词性/释义</button>';
  },
  collectSenses:function(){
    var arr=[];
    $$('#senseList .sense-row').forEach(function(r){
      arr.push({pos:r.querySelector('.pos-btn').getAttribute('data-pos')||'',meaning:r.querySelector('input').value.trim()});
    });
    return arr;
  },
  save:function(){
    var raw=$('#wRaw').value.trim(),phonetic=$('#wPho').value.trim(),note=$('#wNote').value.trim();
    var senses=this.collectSenses().filter(function(s){return s.meaning;});
    var uniq=[];
    senses.forEach(function(s){if(!uniq.some(function(u){return sameSense(u,s);})){uniq.push(s);}});
    if(!raw){Toast('请填写原词');return;}
    if(!/[A-Za-z]/.test(raw)){Toast('原词请包含拉丁字母','danger');return;}
    if(!uniq.length){Toast('请至少填写一组释义','danger');return;}
    if(existsWord(raw,this.editId)){Toast('该词汇已存在','danger');return;}
    var st=Store.state;
    if(this.editId){
      var w=st.words.find(function(x){return x.id===this.editId;}.bind(this));
      if(w){Object.assign(w,{raw:raw,phonetic:phonetic,note:note,senses:uniq});}
    }else{
      st.words.unshift(newWord({raw:raw,phonetic:phonetic,note:note,senses:uniq}));
    }
    Store.save();Modal.close();refreshWords();Toast('已保存');
  }
};

var SentenceSheet={
  editId:null,
  open:function(id){
    this.editId=id||null;
    var s=id?Store.state.sentences.find(function(x){return x.id===id;}):null;
    Modal.sheet('<div class="sheet-head"><span class="sh-title">'+(s?'编辑句子':'新增句子')+'</span><span class="sh-close" data-action="sheet-close">✕</span></div>'+
    '<label class="f-label">原文 <i>*</i></label><input id="sText" value="'+esc(s?s.text:'')+'">'+
    '<label class="f-label">释义</label><input id="sMean" value="'+esc(s?s.meaning:'')+'">'+
    '<label class="f-label">来源</label><input id="sSrc" value="'+esc(s?s.src:'')+'">'+
    '<label class="f-label">语用</label><input id="sUse" value="'+esc(s?s.use:'')+'">'+
    '<button class="btn primary big" data-action="s-save">保存</button>');
  },
  save:function(){
    var t=$('#sText').value.trim(),m=$('#sMean').value.trim(),src=$('#sSrc').value.trim(),use=$('#sUse').value.trim();
    if(!t){Toast('请填写原文');return;}
    var st=Store.state;
    if(this.editId){
      var s=st.sentences.find(function(x){return x.id===this.editId;}.bind(this));
      if(s){Object.assign(s,{text:t,meaning:m,src:src,use:use});}
    }else{
      st.sentences.unshift({id:uid(),type:'sentence',text:t,meaning:m,src:src,use:use});
    }
    Store.save();Modal.close();refreshSents();refreshWords();Toast('已保存');
  }
};

var Search={
  id:null,
  show:function(id){this.id=id;Router.go('search');},
  render:function(){
    var w=Store.state.words.find(function(x){return x.id===this.id;}.bind(this));
    $('#searchBox').innerHTML=w?detailHTML(w):'';
  }
};
var SSearch={
  id:null,
  show:function(id){this.id=id;Router.go('ssearch');},
  render:function(){
    var s=Store.state.sentences.find(function(x){return x.id===this.id;}.bind(this));
    $('#ssearchBox').innerHTML=s?sentCard(s):'';
  }
};
var SentLib={
  render:function(){
    var items=Store.state.sentences.filter(function(s){return s.type==='sentence';});
    $('#sentlibList').innerHTML=items.map(sentCard).join('');
  }
};
var Dict={
  mode:'alpha',folded:{},
  groups:function(){
    var ws=Store.state.words,g=[];
    if(this.mode==='alpha'){
      var m={};
      ws.forEach(function(w){var key=(w.raw[0]||'').toUpperCase();if(!/[A-Z]/.test(key)){key='#';}(m[key]=m[key]||[]).push(w);});
      Object.keys(m).sort().forEach(function(key){g.push([key,m[key]]);});
    }else{
      POS_LIST.forEach(function(p){var list=ws.filter(function(w){return (w.senses||[]).some(function(s){return s.pos===p;});});if(list.length){g.push([p,list]);}});
      var rest=ws.filter(function(w){return !(w.senses||[]).some(function(s){return s.pos&&POS_LIST.indexOf(s.pos)>=0;});});
      if(rest.length){g.push(['其他',rest]);}
    }
    g.forEach(function(pair){pair[1].sort(function(a,b){return a.raw.localeCompare(b.raw);});});
    return g;
  },
  render:function(){
    var self=this;
    $$('#dictSeg .seg-item').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-mode')===self.mode);});
    var g=this.groups();
    $('#qnav').innerHTML=g.map(function(pair){return '<button class="qn" data-action="dict-jump" data-key="'+esc(pair[0])+'">'+esc(pair[0])+'</button>';}).join('');
    $('#dictList').innerHTML=g.map(function(pair){
      var key=pair[0],list=pair[1];
      var folded=!!self.folded[self.mode+':'+key];
      var rows=list.map(function(w){
        return '<div class="card gest" data-gtype="word" data-gid="'+w.id+'">'+
          '<div class="w-name">'+esc(w.raw)+'</div>'+
          (w.phonetic?'<div class="w-pho">'+esc(w.phonetic)+'</div>':'')+
          sensesHTML(w)+
          (w.note?'<div class="w-extra">'+esc(w.note)+'</div>':'')+'</div>';
      }).join('');
      return '<div class="d-group" id="dg-'+esc(key)+'" data-action="dict-fold" data-key="'+esc(key)+'">'+
        '<span class="d-pill"><span class="d-key">'+esc(key)+'</span><span class="cnt">'+list.length+'</span></span>'+
        '<span class="fold '+(folded?'':'open')+'">'+FOLD_SVG+'</span></div>'+(folded?'':rows);
    }).join('');
  },
  jump:function(key){
    var fk=this.mode+':'+key;
    if(this.folded[fk]){this.folded[fk]=false;this.render();}
    requestAnimationFrame(function(){
      var el=document.getElementById('dg-'+key);
      if(!el){return;}
      var top=el.getBoundingClientRect().top+window.pageYOffset-50;
      window.scrollTo({top:top,behavior:'smooth'});
    });
  }
};

var Render={
  words:function(){
    $('#wordCount').textContent=Store.state.words.length;
    var q=$('#searchInput').value;
    var has=q.trim().length>0;
    $('#wordsActions').style.display=has?'none':'';
    $('#sugList').innerHTML=has?wordSugs(q):'';
  },
  sentences:function(){
    $('#sentCount').textContent=Store.state.sentences.filter(function(s){return s.type==='sentence';}).length;
    var q=$('#sentSearch').value;
    var has=q.trim().length>0;
    $('#sentActions').style.display=has?'none':'';
    $('#ssugList').innerHTML=has?sentSugs(q):'';
  },
  search:function(){Search.render();},
  ssearch:function(){SSearch.render();},
  dict:function(){Dict.render();},
  sentlib:function(){SentLib.render();}
};

var Actions={
  tab:function(d){Router.go(d.page);},
  'search-back':function(){Router.back();},
  'ssearch-back':function(){Router.back();},
  'sentlib-open':function(){Router.go('sentlib');},
  'sentlib-back':function(){Router.back();},
  'dict-mode':function(d){Dict.mode=d.mode;Dict.render();},
  'dict-fold':function(d){var fk=Dict.mode+':'+d.key;Dict.folded[fk]=!Dict.folded[fk];Dict.render();},
  'dict-jump':function(d){Dict.jump(d.key);},
  'sense-add':function(){WordSheet.senses=WordSheet.collectSenses();WordSheet.openPos=-1;WordSheet.senses.push({pos:'',meaning:''});WordSheet.renderSenses();},
  'sense-del':function(d){
    WordSheet.senses=WordSheet.collectSenses();
    WordSheet.senses.splice(+d.i,1);
    if(!WordSheet.senses.length){WordSheet.senses.push({pos:'',meaning:''});}
    WordSheet.openPos=-1;
    WordSheet.renderSenses();
  },
  'sense-pos':function(d){
    WordSheet.senses=WordSheet.collectSenses();
    var i=+d.i;
    WordSheet.openPos=(WordSheet.openPos===i)?-1:i;
    WordSheet.renderSenses();
  },
  'sense-pick':function(d){
    WordSheet.senses=WordSheet.collectSenses();
    WordSheet.senses[+d.i].pos=d.pos||'';
    WordSheet.openPos=-1;
    WordSheet.renderSenses();
  },
  'word-add':function(){WordSheet.open();},
  'word-save':function(){WordSheet.save();},
  's-add':function(){SentenceSheet.open();},
  's-save':function(){SentenceSheet.save();},
  'csv-open':function(){Modal.sheet('<div class="sheet-head"><span class="sh-title">批量导入</span><span class="sh-close" data-action="sheet-close">✕</span></div>'+
    '<textarea id="csvBox"></textarea>'+
    '<button class="btn primary big" data-action="csv-save">导入</button>');},
  'csv-save':function(){
    var v=$('#csvBox').value.trim();
    if(!v){Toast('请先粘贴内容');return;}
    Modal.close();
    handleImportText(v);
  },
  'doc-import':function(){$('#iFile').click();},
  'sheet-close':function(){Modal.close();},
  'dlg-ok':function(){Modal.ok();},
  'dlg-cancel':function(){Modal.cancel();}
};
document.addEventListener('click',function(e){
  var p=e.target.closest('.pick');
  if(p){
    if(p.getAttribute('data-type')==='word'){Search.show(p.getAttribute('data-id'));}
    else{SSearch.show(p.getAttribute('data-id'));}
    return;
  }
  var t=e.target.closest('[data-action]');
  if(!t){return;}
  var fn=Actions[t.getAttribute('data-action')];
  if(fn){try{fn(t.dataset,t,e);}catch(err){console.error(err);Toast('操作失败：'+err.message);}}
});
document.addEventListener('input',function(e){
  if(e.target.id==='searchInput'){
    var q=e.target.value,has=q.trim().length>0;
    $('#wordsActions').style.display=has?'none':'';
    $('#sugList').innerHTML=has?wordSugs(q):'';
  }
  if(e.target.id==='sentSearch'){
    var q2=e.target.value,has2=q2.trim().length>0;
    $('#sentActions').style.display=has2?'none':'';
    $('#ssugList').innerHTML=has2?sentSugs(q2):'';
  }
  if(e.target.id==='wRaw'&&!WordSheet.phoTouched){
    var p=$('#wPho');if(p){p.value=genIPA(e.target.value);}
  }
  if(e.target.id==='wPho'){WordSheet.phoTouched=e.target.value.trim()!=='';}
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){Store.save();}});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id!=='iFile'){return;}
  var f=el.files[0];if(!f){return;}
  var name=(f.name||'').toLowerCase();
  var fr=new FileReader();
  fr.onload=function(){
    if(name.endsWith('.docx')){
      readDocxIn(fr.result).then(function(text){applyImport(text);}).catch(function(){Toast('无法解析该文件，请转为 txt 后重试');});
    }else{
      try{
        var text=(name.endsWith('.doc'))?readDoc(fr.result):String(fr.result);
        applyImport(text);
      }catch(err){Toast('无法解析该文件，请转为 txt 后重试');}
    }
    el.value='';
  };
  if(name.endsWith('.docx')||name.endsWith('.doc')){fr.readAsArrayBuffer(f);}
  else{fr.readAsText(f);}
});

document.addEventListener('plusready',function(){
  plus.key.addEventListener('backbutton',function(){
    if(document.querySelector('.sheet')){Modal.close();return;}
    if(Router.current==='words'){plus.runtime.quit();return;}
    Router.back();
  },false);
});

(function boot(){
  try{
    Modal.init();
    Gesture.init();
    Persist.check();
    Store.load().then(function(){
      Router.show('words');
    }).catch(function(err){console.error(err);Toast('启动异常：'+err.message);});
  }catch(err){console.error(err);Toast('启动异常：'+err.message);}
})();
</script>
</body>
</html>
