<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>人造语言学习助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#f6f6f4;--bg2:#ebebe9;--card:#fff;--card2:#f1f1ef;--tabbg:rgba(255,255,255,.92);--line:rgba(0,0,0,.09);
  --text:#1c1c1e;--text2:#6e6e73;--text3:#a8a8ad;
  --btnbg:#1c1c1e;--btnfg:#fff;--prisoft:#ececea;--ring:rgba(0,0,0,.1);
  --accent:#8a6b4f;--tanbg:#efe4d3;
  --danger:#b3261e;--dangersoft:#f6e7e5;
  --sh1:0 1px 8px rgba(0,0,0,.05);--sh2:0 10px 30px rgba(0,0,0,.14);
  --r:16px;--rs:10px;--tabh:58px;
}
[data-theme="dark"]{
  --bg1:#141416;--bg2:#0c0c0e;--card:#1c1c1f;--card2:#242427;--tabbg:rgba(16,16,18,.92);--line:rgba(255,255,255,.1);
  --text:#f2f2f4;--text2:#9a9aa0;--text3:#5f5f64;
  --btnbg:#f2f2f4;--btnfg:#141416;--prisoft:#2a2a2e;--ring:rgba(255,255,255,.14);
  --accent:#c8a97e;--tanbg:#37302a;
  --danger:#ff8a80;--dangersoft:#3a2626;
  --sh1:0 1px 8px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.6);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;font-size:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.page{display:none}.page.active{display:block;animation:fadeUp .3s ease}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 15px}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:.5px;white-space:nowrap;line-height:1.2}
.head-l{display:flex;align-items:center;gap:8px}
.back2{font-size:18px;color:var(--text2);padding:2px 8px}
.count-chip{background:var(--prisoft);color:var(--accent);border-radius:999px;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1;height:24px;padding:0 11px;flex:none;transform:translateY(2px)}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin:10px 0;box-shadow:var(--sh1);border:1px solid var(--line)}
.card.tap{cursor:pointer;transition:transform .15s}
.card.tap:active{transform:scale(.98)}
.note-box{border-left:4px solid var(--accent);color:var(--text2);font-size:13.5px;line-height:1.7}
.sug{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.sug-k{font-weight:700;font-size:15px;color:var(--text)}
.sug-v{color:var(--text3);font-size:14px}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:7px 7px 7px 17px;box-shadow:var(--sh1);border:1px solid var(--line);margin-bottom:5px}
.search-wrap input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14px}
.search-big{padding:13px 18px}
.search-big input{font-size:15px}
.s-go{flex:none;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:700;background:var(--btnbg);color:var(--btnfg);transition:transform .15s}
.s-go:active{transform:scale(.94)}
.btn{display:block;width:100%;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600;margin-top:8px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--btnbg);color:var(--btnfg)}
.btn.soft{background:var(--card);border:1px solid var(--line);color:var(--text);box-shadow:var(--sh1)}
.btn.tan{background:var(--tanbg);color:var(--accent);border:none;box-shadow:none}
.btn.big{padding:14px;border-radius:14px;font-size:15px;margin-top:14px}
.btn-row.two{display:flex;gap:8px}.btn-row.two .btn{flex:1;margin-top:10px}
.seg{display:flex;gap:6px;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:6px}
.seg-item{flex:1;text-align:center;padding:10px 0;border-radius:9px;color:var(--text2);font-size:13.5px;transition:.2s}
.seg-item:not(.on){border:1px solid var(--line)}
.seg-item.on{background:var(--btnbg);color:var(--btnfg);font-weight:700}
.qnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;
  background:linear-gradient(var(--bg1) 78%,transparent);scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qn{flex:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--text2);transition:.15s}
.qn:active{transform:scale(.93);color:var(--text)}
.stat-row{display:flex}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:20px;color:var(--text);margin-bottom:4px}
.stat span{font-size:12px;color:var(--text2)}
.w-name{font-size:18px;font-weight:800;color:var(--text)}
.w-pho{margin-top:6px;color:var(--text3);font-size:14px}
.w-sub{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.w-mean-i{color:var(--text2);font-size:14px}
.w-tag{background:var(--prisoft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700}
.w-extra{margin-top:6px;color:var(--text3);font-size:13px;white-space:pre-wrap}
.hint-line{font-size:12px;color:var(--text3);margin:0 2px 6px;text-align:center}
.d-group{display:flex;align-items:center;margin:18px 2px 8px;padding:4px 2px;cursor:pointer}
.d-pill{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh1)}
.d-key{font-size:18px;font-weight:800;color:var(--accent);letter-spacing:1px;line-height:1}
.d-group .cnt{color:var(--text2);font-size:14px;font-weight:700;line-height:1}
.d-group .fold{margin-left:auto;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.d-group .fold svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:3;stroke-linejoin:round;transition:transform .2s}
.d-group .fold.open svg{transform:rotate(90deg)}
.pos-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pos-item{border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;background:var(--card2);color:var(--text2);transition:.15s}
.pos-item:active{transform:scale(.95)}
.pos-item.on{background:var(--btnbg);color:var(--btnfg)}
.f-label{display:block;font-size:13px;color:var(--text2);margin:12px 0 5px}
.f-label i{color:var(--danger);font-style:normal}
.sheet input,.sheet textarea{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:var(--rs);padding:11px 13px;font-size:14px;outline:none;transition:.2s}
.sheet input:focus,.sheet textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.sheet textarea{min-height:120px;resize:vertical}
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;z-index:20;
  background:var(--tabbg);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transition:transform .25s ease}
#tabbar.kb-hide{transform:translateY(110%)}
#tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabh);color:var(--text3);font-size:11px;font-weight:600}
#tabbar .ico{font-size:17px;filter:grayscale(1);opacity:.8}
#tabbar .tab.on{color:var(--text)}
#tabbar .tab.on .ico{opacity:1}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translate(-50%,-220%);opacity:0;
  background:rgba(24,24,26,.92);color:#fff;padding:9px 19px;border-radius:999px;font-size:13px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s;z-index:99;max-width:92%;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
.sheet{position:fixed;inset:0;z-index:50}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:slideUp .3s cubic-bezier(.2,.9,.3,1)}
.sheet.center{display:flex;align-items:flex-start;justify-content:center;padding:18vh 16px 0}
.dialog{position:relative;background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:320px;box-shadow:var(--sh2);animation:scaleIn .2s ease}
.d-title{font-size:16px;font-weight:700;margin-bottom:6px;text-align:center}
.d-content{font-size:13.5px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.d-btns{display:flex;gap:8px;margin-top:16px}
.d-btns .btn{margin-top:0;flex:1;padding:10px}
.btn.danger{background:var(--danger);color:#fff}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sh-title{font-size:16px;font-weight:700}
.sh-close{color:var(--text3);padding:4px 8px}
</style>
</head>
<body>

  <button class="tab on" data-action="tab" data-page="words"><span class="ico">📝</span>词汇</button>

    <div class="card">
      <div class="btn-row two">
        <button class="btn tan" data-action="exp-words-txt">词库 TXT</button>
        <button class="btn tan" data-action="exp-words-docx">词库 DOCX</button>
      </div>
    </div>
    <div class="card">
      <button class="btn primary" data-action="export">导出</button>
      <button class="btn soft" data-action="import">导入</button>
    </div>
  </section>

</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<input type="file" id="iFile" accept=".json,.txt,.md,.csv,.text,.doc,.docx,application/json,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

<script>
'use strict';
window.addEventListener('error',function(e){console.error(e);Toast('运行异常：'+(e.message||'未知错误'));});

/* ===== 工具 ===== */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.from((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function newWord(obj){var o={id:uid(),created:Date.now(),raw:'',phonetic:'',pos:'',meaning:'',note:''};for(var k in obj)o[k]=obj[k];return o;}
var POS_LIST=['名词','动词','修饰词','数词','冠词','代词','介词','连词','疑问词','功能词','声词'];
var POS_RE=new RegExp('^('+POS_LIST.join('|')+')');
function existsWord(raw,exceptId){return Store.state.words.some(function(w){return w.raw.toLowerCase()===raw.toLowerCase()&&w.id!==exceptId;});}
var FOLD_SVG='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3 L15 10 L6 17 Z"></path></svg>';

/* ===== 音标自动生成 ===== */
var C_IPA={p:'p',b:'b',t:'t',d:'d',c:'k',g:'g',ch:'tʃ',j:'dʒ',f:'f',v:'v',s:'s',z:'z',sh:'ʃ',h:'h',m:'m',n:'n',r:'r',l:'l',y:'j',w:'w'};
var V_IPA={a:'a',e:'e',i:'i',o:'o',u:'u',ai:'ai',ei:'ei',oi:'oi',au:'au',eu:'eu'};
var CLUSTERS=['pl','pr','bl','br','tr','dr','cl','cr','gl','gr','fl','fr','sp','st','sc'];
function tokenizeIPA(s){
  s=String(s).toLowerCase();
  var units=[],i=0;
  while(i<s.length){
    var ch=s[i];
    if(!/[a-z]/.test(ch)){i++;continue;}
    var d=null,ks=['ai','ei','oi','au','eu'];
    for(var ki=0;ki<ks.length;ki++){if(s.indexOf(ks[ki],i)===i){d=ks[ki];break;}}
    if(d){units.push({v:1,g:d,ipa:V_IPA[d]});i+=d.length;continue;}
    if('aeiou'.indexOf(ch)>=0){units.push({v:1,g:ch,ipa:V_IPA[ch]});i++;continue;}
    var c=ch;
    if(s.indexOf('ch',i)===i)c='ch';else if(s.indexOf('sh',i)===i)c='sh';
    if(C_IPA[c])units.push({v:0,g:c,ipa:C_IPA[c]});
    i+=c.length;
  }
  return units;
}
function syllabify(units){
  var vIdx=units.map(function(u,i){return u.v?i:-1;}).filter(function(i){return i>=0;});
  if(!vIdx.length)return [units];
  var sylls=[],cur=[];
  for(var i=0;i<=vIdx[0];i++)cur.push(units[i]);
  for(var vi=1;vi<vIdx.length;vi++){
    var nextV=vIdx[vi];
    var cs=units.slice(vIdx[vi-1]+1,nextV);
    var coda=[],onset=cs;
    if(cs.length){
      var g=cs.map(function(u){return u.g;}).join('');
      if(!(cs.length===1||CLUSTERS.indexOf(g)>=0)){coda=[cs[0]];onset=cs.slice(1);}
    }
    cur=cur.concat(coda);
    sylls.push(cur);
    cur=onset.concat([units[nextV]]);
  }
  for(var j=vIdx[vIdx.length-1]+1;j<units.length;j++)cur.push(units[j]);
  sylls.push(cur);
  return sylls;
}
function genIPA(raw){
  var ws=String(raw).toLowerCase().split(/\s+/).filter(function(w){return /[a-z]/.test(w);});
  var parts=[];
  for(var i=0;i<ws.length;i++){
    var units=tokenizeIPA(ws[i]);
    if(!units.length)continue;
    var sylls=syllabify(units);
    var stress=Math.max(0,sylls.length-2);
    parts.push(sylls.map(function(sy,idx){return (idx===stress?"'":'')+sy.map(function(u){return u.ipa;}).join('');}).join('.'));
  }
  return parts.length?('/'+parts.join(' ')+'/'):'';
}

/* ===== 存储层 ===== */
var NAME_KEY='CONLANG::';
var Persist={
  ok:false,
  check:function(){try{localStorage.setItem('__probe','1');this.ok=localStorage.getItem('__probe')==='1';localStorage.removeItem('__probe');}catch(e){this.ok=false;}return this.ok;}
};
function idbOpen(){return new Promise(function(res,rej){var q=indexedDB.open('conlang-db',1);
  q.onupgradeneeded=function(){q.result.createObjectStore('kv');};
  q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
function idbSet(v){idbOpen().then(function(db){db.transaction('kv','readwrite').objectStore('kv').put(v,'data');}).catch(function(){});}
function idbGet(){return idbOpen().then(function(db){return new Promise(function(res){var g=db.transaction('kv').objectStore('kv').get('data');
  g.onsuccess=function(){res(g.result||null);};g.onerror=function(){res(null);};});}).catch(function(){return null;});}
function nameGet(){try{var n=window.name||'';if(n.indexOf(NAME_KEY)===0)return JSON.parse(n.slice(NAME_KEY.length));}catch(e){}return null;}
function nameSet(j){try{if(j.length<1e6)window.name=NAME_KEY+j;}catch(e){}}
var Store={
  KEY:'conlang.studio.v23', state:null,
  defaults:function(){return {version:23,langName:'我的人造语言',words:[]};},
  load:function(){
    var self=this,s=null,src='';
    if(Persist.ok){try{var v=JSON.parse(localStorage.getItem(this.KEY));if(v){s=v;src='ls';}}catch(e){}}
    var p=Promise.resolve();
    if(!s)p=idbGet().then(function(v){if(v){s=v;src='idb';}});
    return p.then(function(){
      if(!s){var v2=nameGet();if(v2){s=v2;src='name';}}
      if(!s&&Persist.ok){var ks=['conlang.studio.v22','conlang.studio.v21'];
        for(var i=0;i<ks.length;i++){try{var v3=JSON.parse(localStorage.getItem(ks[i]));if(v3){s=v3;src='ls';break;}}catch(e){}}}
      var d=self.defaults();s=(s&&typeof s==='object')?s:{};
      self.state=Object.assign({},d,s,{words:Array.isArray(s.words)?s.words:[]});
      var migrated=false;
      if(!self.state.ipaV2){
        self.state.words.forEach(function(w){w.phonetic=genIPA(w.raw);});
        self.state.ipaV2=2;migrated=true;
      }else{
        self.state.words.forEach(function(w){if(!w.phonetic)w.phonetic=genIPA(w.raw);});
      }
      if(src||migrated)self.save();
    });
  },
  save:function(){
    var j=JSON.stringify(this.state);
    if(Persist.ok){try{localStorage.setItem(this.KEY,j);}catch(e){Persist.ok=false;}}
    idbSet(j);
    nameSet(j);
  }
};

/* ===== 下载：APP 内写入 Download/Tansica（Android 10-16 免权限），浏览器走 a[download] ===== */
function anchorDownload(blob,filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},3000);
    Toast('已触发下载');
  }catch(e){Toast('下载失败');}
}
function saveBlobPlus(blob,filename,mime){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var b64=String(reader.result).split(',')[1]||'';
      var Base64=plus.android.importClass('android.util.Base64');
      var bytes=Base64.decode(b64,0);
      var saved='';
      /* 1) MediaStore（Android 10-16，无需权限）→ Download/Tansica/ */
      try{
        var main=plus.android.runtimeMainActivity();
        plus.android.importClass('android.content.ContentResolver');
        var ContentValues=plus.android.importClass('android.content.ContentValues');
        var MSD=plus.android.importClass('android.provider.MediaStore$Downloads');
        var resolver=main.getContentResolver();
        var values=new ContentValues();
        values.put('_display_name',filename);

          var File=plus.android.importClass('java.io.File');

function crc32(buf){
  var t=crc32.t;
  if(!t){t=crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}
  var cc=0xFFFFFFFF;
  for(var i=0;i<buf.length;i++)cc=t[(cc^buf[i])&0xFF]^(cc>>>8);
  return (cc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  var enc=new TextEncoder();
  var parts=[],central=[],offset=0;
  files.forEach(function(f){
    var name=enc.encode(f.name),data=f.data,crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  });
  var csize=central.reduce(function(s,p){return s+p.length;},0);
  var eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(4,0,true);eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
  eo.setUint32(12,csize,true);eo.setUint32(16,offset,true);eo.setUint16(20,0,true);
  parts.push.apply(parts,central);parts.push(new Uint8Array(eo.buffer));
  var total=parts.reduce(function(s,p){return s+p.length;},0);
  var out=new Uint8Array(total),o=0;
  parts.forEach(function(p){out.set(p,o);o+=p.length;});
  return out;
}
function makeDocx(paras){
  function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var body=paras.map(function(p){
    var pr=(p.b||p.sz)?('<w:rPr>'+(p.b?'<w:b/>':'')+(p.sz?'<w:sz w:val="'+p.sz+'"/>':'')+'</w:rPr>'):'';
    return '<w:p><w:r>'+pr+'<w:t xml:space="preserve">'+x(p.text)+'</w:t></w:r></w:p>';
  }).join('');
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr/></w:body></w:document>';
  var types='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var enc=new TextEncoder();
  return zipStore([
    {name:'[Content_Types].xml',data:enc.encode(types)},
    {name:'_rels/.rels',data:enc.encode(rels)},
    {name:'word/document.xml',data:enc.encode(doc)}
  ]);
}

function cleanDocxXml(xml){
  return xml.replace(/<w:tab[^>]*>/g,'\t').replace(/<w:br[^>]*>/g,'\n').replace(/<\/w:p>/g,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\u00a0/g,' ');
}
function readDocxIn(buf){
  var dv=new DataView(buf),eocd=-1;
  for(var i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)return Promise.reject(0);
  var count=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true);
  var ent={};
  for(var k=0;k<count;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    var method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),
      clen=dv.getUint16(off+32,true),lhdr=dv.getUint32(off+42,true);
    ent[new TextDecoder().decode(new Uint8Array(buf,off+46,nlen))]={method:method,csize:csize,lhdr:lhdr};
    off+=46+nlen+elen+clen;
  }
  var e=ent['word/document.xml'];if(!e)return Promise.reject(0);
  var lnlen=dv.getUint16(e.lhdr+26,true),lelen=dv.getUint16(e.lhdr+28,true);
  var data=new Uint8Array(buf,e.lhdr+30+lnlen+lelen,e.csize);
  if(e.method===0)return Promise.resolve(cleanDocxXml(new TextDecoder().decode(data)));
  if(e.method===8&&'DecompressionStream' in window){
    var st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(st).arrayBuffer().then(function(ab){return cleanDocxXml(new TextDecoder().decode(ab));});
  }
  return Promise.reject(0);
}
function readDoc(buf){
  var dv=new DataView(buf),out='',cur='';
  function fl(){var t=cur.trim();if(t.length>=4)out+=t+'\n';cur='';}
  for(var i=0;i+1<buf.byteLength;i+=2){
    var ch=dv.getUint16(i,true);
    if((ch>=0x4e00&&ch<=0x9fff)||(ch>=0x3000&&ch<=0x303f)||ch===0xff08||ch===0xff09||(ch>=0x20&&ch<0x7f)||ch===13||ch===10||ch===9)cur+=String.fromCharCode(ch);
    else fl();
  }
  fl();return out;
}
function isHead(l){
  if(!l||l.length>=40)return false;
  var m=l.match(/^(#{1,6}\s+|第[一二三四五六七八九十百0-9]+[章节讲]|[一二三四五六七八九十]+[、.]|\d+[、.．]\s*|【)/);
  if(!m)return false;
  return !/[a-zA-Z]/.test(l.slice(m[0].length));
}
function isGarbage(l){return /[<>{}]|xmlns|https?:\/\//i.test(l);}
function classifyWord(t){
  t=String(t).replace(/^\ufeff/,'').trim();
  if(!t||isGarbage(t))return null;
  var pos='';
  var bm=t.match(/[（(]([^()（）]{1,12})[)）]/)||t.match(/\[([^\[\]]{1,12})\]/);
  if(bm&&POS_RE.test(bm[1]))pos=POS_RE.exec(bm[1])[0];
  var clean=t.replace(/\/[^/]*\//g,' ').replace(/\[[^\]]*\]/g,' ').replace(/[（(][^)）]*[)）]/g,' ');
  var latinRuns=clean.match(/[A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*)*/g);
  if(!latinRuns)return null;
  var cjkRuns=clean.match(/[\u4e00-\u9fff][\u4e00-\u9fff，,。；;：:、！!？?—\-]*/g)||[];
  var cands=[];
  for(var i=0;i<cjkRuns.length;i++){
    var r=cjkRuns[i].replace(/[\s，,。；;：:、！!？?—\-]+$/,'');
    if(!r)continue;
    var skip=false;
    for(var pi=0;pi<POS_LIST.length;pi++){
      var p=POS_LIST[pi];
      if(r===p){pos=pos||p;skip=true;break;}
      if(r.indexOf(p)===0&&r.length>p.length&&/[，,。；;：:、]/.test(r.charAt(p.length))){pos=pos||p;r=r.slice(p.length+1);break;}
    }
    if(skip)continue;
    if(r)cands.push(r);
  }
  if(!cands.length)return null;
  var latin=latinRuns.slice().sort(function(a,b){return b.length-a.length;})[0].replace(/[\s.,;:!?]+$/,'').trim();
  var cjk=cands.join('');
  if(!latin||!cjk)return null;
  return {raw:latin,pos:pos,meaning:cjk};
}
function smartParse(text){
  var res=[],seen={};
  String(text).replace(/^\ufeff/,'').split(/\r?\n/).forEach(function(line0){
    var line=line0.trim();
    if(!line||isHead(line)||isGarbage(line))return;
    line=line.replace(/^\d+[、.．]\s*/,'');
    var e=classifyWord(line);
    if(e){var k=e.raw.toLowerCase();if(!seen[k]){seen[k]=1;res.push(e);}}
  });
  return res;
}
function handleImportText(txt){
  var r=smartParse(txt);
  var st=Store.state;
  var newW=r.filter(function(w){return !existsWord(w.raw,null);});
  var dup=r.length-newW.length;
  if(!newW.length){Toast(dup?'全部重复，未导入':'未识别到内容',dup?'danger':undefined);return;}
  Modal.confirm({title:'识别结果',ok:'导入',content:'新词 '+newW.length+' 个（重复跳过 '+dup+'）\n\n是否导入？'})
  .then(function(ok){
    if(!ok)return;
    newW.forEach(function(w){w.phonetic=w.phonetic||genIPA(w.raw);st.words.unshift(newWord(w));});
    Store.save();refreshWords();
    Toast('已导入 '+newW.length+' 个词汇');
  });
}
function applyImport(txt){

var Gesture={
  tapTimer:null,lastTap:0,suppress:false,lpTimer:null,lx:0,ly:0,
  init:function(){
    var self=this;

    });
    document.addEventListener('pointerup',function(){clearTimeout(self.lpTimer);});
    document.addEventListener('pointercancel',function(){clearTimeout(self.lpTimer);});
    document.addEventListener('contextmenu',function(e){if(e.target.closest('.w-name.act'))e.preventDefault();});
    document.addEventListener('click',function(e){
      var t=e.target.closest('.w-name.act');
      if(!t)return;
      if(self.suppress){self.suppress=false;return;}
      var now=Date.now();
      if(now-self.lastTap<300){
        self.lastTap=0;clearTimeout(self.tapTimer);
        delWord(t.getAttribute('data-wid'));
      }else{
        self.lastTap=now;
        clearTimeout(self.tapTimer);
        var id=t.getAttribute('data-wid');

      }

function copyWord(id){

    document.body.appendChild(ta);ta.focus();ta.select();

    ta.remove();};

    '<div class="pos-grid" id="posGrid">'+POS_LIST.map(function(p){return '<button class="pos-item '+(self.pos===p?'on':'')+'" data-action="pos-pick" data-pos="'+p+'">'+p+'</button>';}).join('')+'</div>'+
    '<label class="f-label">释义 <i>*</i></label><input id="wMean" value="'+esc(w?w.meaning:'')+'">'+
    '<label class="f-label">补充说明</label><textarea id="wNote">'+esc(w?w.note:'')+'</textarea>'+
    '<button class="btn primary big" data-action="word-save">保存</button>');
  },
  save:function(){
    var raw=$('#wRaw').value.trim(),phonetic=$('#wPho').value.trim(),meaning=$('#wMean').value.trim(),note=$('#wNote').value.trim();
    if(!raw||!meaning){Toast('请填写原词和释义');return;}
    if(existsWord(raw,this.editId)){Toast('该词汇已存在','danger');return;}
    var st=Store.state;
    if(this.editId){
      var w=st.words.find(function(x){return x.id===this.editId;}.bind(this));
      if(w)Object.assign(w,{raw:raw,phonetic:phonetic,pos:this.pos,meaning:meaning,note:note});
    }else st.words.unshift(newWord({raw:raw,phonetic:phonetic,pos:this.pos,meaning:meaning,note:note}));
    Store.save();Modal.close();refreshWords();Toast('已保存');
  }
};

/* ===== 搜索结果页 ===== */
var Search={
  q:'',
  render:function(){
    var inp=$('#resultSearch');
    if(inp.value!==this.q)inp.value=this.q;
    var k=this.q.trim();
    var st=Store.state;
    var html='';
    if(k){
      if(/^[A-Za-z]/.test(k)){
        var w=st.words.find(function(x){return x.raw.toLowerCase()===k.toLowerCase();});
        html=w?detailHTML(w):'';
      }else{
        html=st.words.filter(function(x){return x.meaning.indexOf(k)>=0;}).map(function(x){
          return '<div class="card tap" data-action="word-open" data-id="'+x.id+'">'+
            '<div class="sug"><span class="sug-k">'+esc(x.meaning)+'</span><span class="sug-v">'+esc(x.raw)+'</span></div></div>';
        }).join('');
      }
    }
    $('#searchList').innerHTML=html;
  },
  go:function(){
    var v=($('#searchInput').value||'').trim();
    if(!v){Toast('先输入要查的内容');return;}
    this.q=v;Router.go('search');
  }
};

/* ===== 词卡页 ===== */
var WordPage={
  id:null,from:'dict',
  open:function(id,from){this.id=id;this.from=from||'dict';Router.go('word');},
  render:function(){
    var w=Store.state.words.find(function(x){return x.id===this.id;}.bind(this));
    $('#wordBox').innerHTML=w?detailHTML(w):'';
  }
};

/* ===== 词库 ===== */
var Dict={
  mode:'alpha',folded:{},
  groups:function(){
    var ws=Store.state.words,g=[];
    if(this.mode==='alpha'){
      var m={};
      ws.forEach(function(w){var key=(w.raw[0]||'').toUpperCase();if(!/[A-Z]/.test(key))key='#';(m[key]=m[key]||[]).push(w);});
      Object.keys(m).sort().forEach(function(key){g.push([key,m[key]]);});
    }else{
      POS_LIST.forEach(function(p){var list=ws.filter(function(w){return w.pos===p;});if(list.length)g.push([p,list]);});
      var rest=ws.filter(function(w){return !w.pos||POS_LIST.indexOf(w.pos)<0;});
      if(rest.length)g.push(['其他',rest]);
    }
    g.forEach(function(pair){pair[1].sort(function(a,b){return a.raw.localeCompare(b.raw);});});
    return g;
  },
  render:function(){
    var self=this;
    $$('#dictSeg .seg-item').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-mode')===self.mode);});
    var g=this.groups();
    $('#qnav').innerHTML=g.map(function(pair){return '<button class="qn" data-action="dict-jump" data-key="'+esc(pair[0])+'">'+esc(pair[0])+'</button>';}).join('');
    $('#dictList').innerHTML=g.map(function(pair){
      var key=pair[0],list=pair[1];
      var folded=!!self.folded[self.mode+':'+key];
      var rows=list.map(function(w){
        return '<div class="card tap" data-action="word-open" data-id="'+w.id+'">'+
          '<div class="w-name">'+esc(w.raw)+'</div>'+
          (w.phonetic?'<div class="w-pho">'+esc(w.phonetic)+'</div>':'')+
          '<div class="w-sub">'+(w.pos?'<span class="w-tag">'+esc(w.pos)+'</span>':'')+'<span class="w-mean-i">'+esc(w.meaning)+'</span></div>'+
          (w.note?'<div class="w-extra">'+esc(w.note)+'</div>':'')+'</div>';
      }).join('');
      return '<div class="d-group" id="dg-'+esc(key)+'" data-action="dict-fold" data-key="'+esc(key)+'">'+
        '<span class="d-pill"><span class="d-key">'+esc(key)+'</span><span class="cnt">'+list.length+'</span></span>'+
        '<span class="fold '+(folded?'':'open')+'">'+FOLD_SVG+'</span></div>'+(folded?'':rows);
    }).join('');
  },
  jump:function(key){
    var fk=this.mode+':'+key;
    if(this.folded[fk]){this.folded[fk]=false;this.render();}
    requestAnimationFrame(function(){
      var el=document.getElementById('dg-'+key);
      if(!el)return;
      var top=el.getBoundingClientRect().top+window.pageYOffset-50;
      window.scrollTo({top:top,behavior:'smooth'});
    });
  }
};

/* ===== 渲染 ===== */
var Render={
  words:function(){$('#wordCount').textContent=Store.state.words.length;},
  search:function(){Search.render();},
  dict:function(){Dict.render();},
  word:function(){WordPage.render();},
  settings:function(){
    var s=Store.state;
    $('#statsRow').innerHTML='<div class="stat"><b>'+s.words.length+'</b><span>词汇</span></div>';
  }
};

/* ===== 事件 ===== */
var Actions={
  tab:function(d){Router.go(d.page);},
  'search-go':function(){Search.go();},
  'search-back':function(){Router.back();},
  'word-back':function(){Router.back();},
  'word-open':function(d){WordPage.open(d.id,Router.current==='search'?'search':'dict');},
  'dict-mode':function(d){Dict.mode=d.mode;Dict.render();},
  'dict-fold':function(d){var fk=Dict.mode+':'+d.key;Dict.folded[fk]=!Dict.folded[fk];Dict.render();},
  'dict-jump':function(d){Dict.jump(d.key);},
  'pos-pick':function(d){
    WordSheet.pos=(WordSheet.pos===d.pos)?'':d.pos;
    $$('#posGrid .pos-item').forEach(function(el){el.classList.toggle('on',el.getAttribute('data-pos')===WordSheet.pos);});
  },
  'word-add':function(){WordSheet.open();},
  'word-save':function(){WordSheet.save();},
  'csv-open':function(){Modal.sheet('<div class="sheet-head"><span class="sh-title">批量导入</span><span class="sh-close" data-action="sheet-close">✕</span></div>'+
    '<textarea id="csvBox"></textarea>'+
    '<button class="btn primary big" data-action="csv-save">导入</button>');},
  'csv-save':function(){
    var v=$('#csvBox').value.trim();
    if(!v){Toast('请先粘贴内容');return;}
    Modal.close();
    handleImportText(v);
  },
  'sheet-close':function(){Modal.close();},
  'dlg-ok':function(){Modal.ok();},
  'dlg-cancel':function(){Modal.cancel();},
  'exp-words-txt':function(){exportWordsTXT();},
  'exp-words-docx':function(){exportWordsDocx();},
  export:function(){
    var s=JSON.stringify(Store.state,null,2);
    Modal.sheet('<div class="sheet-head"><span class="sh-title">导出</span><span class="sh-close" data-action="sheet-close">✕</span></div>'+
    '<textarea id="expBox" style="min-height:200px">'+esc(s)+'</textarea>'+
    '<button class="btn primary big" data-action="exp-copy">复制全部</button>'+
    '<button class="btn soft" data-action="exp-dl">下载为文件</button>');
  },
  'exp-copy':function(){
    var el=$('#expBox');el.focus();el.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(ok)Toast('已复制，可粘贴保存');
    else if(navigator.clipboard)navigator.clipboard.writeText(el.value)
      .then(function(){Toast('已复制，可粘贴保存');}).catch(function(){Toast('请长按文本手动复制');});
    else Toast('请长按文本手动复制');
  },
  'exp-dl':function(){
    download(new Blob([$('#expBox').value],{type:'application/json'}),Store.state.langName+'-资料.json','application/json');
  },
  import:function(){$('#iFile').click();}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');if(!t)return;
  var fn=Actions[t.getAttribute('data-action')];
  if(fn){try{fn(t.dataset,t,e);}catch(err){console.error(err);Toast('操作失败：'+err.message);}}
});
document.addEventListener('input',function(e){
  if(e.target.id==='resultSearch'){Search.q=e.target.value;Search.render();}
  if(e.target.id==='wRaw'&&!WordSheet.phoTouched){
    var p=$('#wPho');if(p)p.value=genIPA(e.target.value);
  }
  if(e.target.id==='wPho'){WordSheet.phoTouched=e.target.value.trim()!=='';}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='searchInput'){
    if(e.isComposing||e.keyCode===229)return;
    e.preventDefault();Search.go();
  }
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')Store.save();});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id!=='iFile')return;
  var f=el.files[0];if(!f)return;
  var name=(f.name||'').toLowerCase();
  var fr=new FileReader();
  fr.onload=function(){
    if(name.endsWith('.docx')){
      readDocxIn(fr.result).then(function(text){applyImport(text);}).catch(function(){Toast('无法解析该文件，请转为 txt 后重试');});
    }else{
      try{
        var text=(name.endsWith('.doc'))?readDoc(fr.result):String(fr.result);
        applyImport(text);
      }catch(err){Toast('无法解析该文件，请转为 txt 后重试');}
    }
    el.value='';
  };
  if(name.endsWith('.docx')||name.endsWith('.doc'))fr.readAsArrayBuffer(f);
  else fr.readAsText(f);
});

/* ===== HBuilderX APP：安卓硬件返回键 ===== */
document.addEventListener('plusready',function(){
  plus.key.addEventListener('backbutton',function(){
    if(document.querySelector('.sheet')){Modal.close();return;}
    if(Router.current==='words'){plus.runtime.quit();return;}
    Router.back();
  },false);
});

/* ===== 启动 ===== */
(function boot(){
  try{
    Modal.init();
    Gesture.init();
    Persist.check();
    Store.load().then(function(){
      Router.show('words');
    }).catch(function(err){console.error(err);Toast('启动异常：'+err.message);});
  }catch(err){console.error(err);Toast('启动异常：'+err.message);}
})();
</script>
